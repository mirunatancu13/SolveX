<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolveX Air - Încarcă Poză</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e;
            --text-color: #ffffff; --accent: #bb86fc; --success: #03dac6;
        }
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-weight: 300; letter-spacing: 2px; }
        .container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .panel {
            flex: 1; background-color: var(--panel-bg); border-radius: 15px; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        video, .whiteboard-container {
            border-radius: 10px; width: 100%; max-width: 640px; aspect-ratio: 4/3;
            background-color: #000;
        }
        video { object-fit: cover; transform: scaleX(-1); }

        .whiteboard-container { position: relative; background-color: white; overflow: hidden; }
        #canvas-bg, #whiteboard, #whiteboard-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        
        #canvas-bg { z-index: 1; }
        #whiteboard { z-index: 2; }
        #whiteboard-overlay { z-index: 3; pointer-events: none; }

        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button {
            background-color: var(--accent); color: #000; border: none; padding: 10px 15px;
            border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-tool { background-color: #03dac6; }
        .btn-danger { background-color: #cf6679; color: white; }
        .btn-action { background-color: #ffb74d; } /* Culoare pentru butoanele noi */

        #output {
            width: 100%; max-width: 640px; margin-top: 15px; flex: 1;
            background: #2c2c2c; padding: 15px; border-radius: 8px;
            box-sizing: border-box; overflow-y: auto; font-family: monospace;
            white-space: pre-wrap; font-size: 14px;
        }
        .status { margin-top: 10px; color: var(--success); font-size: 14px; font-weight: bold; }
        
        /* Ascundem inputul de fișier */
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SolveX Air</h1>
    </div>

    <div class="container">
        <div class="panel">
            <video id="videoElement" autoplay playsinline></video>
            <div id="camStatus" class="status">Status: Inițializare MediaPipe...</div>
            <button id="voiceBtn" class="controls btn-tool" style="margin-top: 20px;">🎤 Comenzi Vocale</button>
        </div>

        <div class="panel">
            <div class="whiteboard-container">
                <canvas id="canvas-bg" width="640" height="480"></canvas>
                <canvas id="whiteboard" width="640" height="480"></canvas>
                <canvas id="whiteboard-overlay" width="640" height="480"></canvas>
            </div>
            
            <div class="controls">
                <button class="btn-tool" onclick="setMode('pen')">✒️ Creion</button>
                <button class="btn-tool" onclick="setMode('eraser')">🧽 Gumă</button>
                <button class="btn-danger" onclick="clearCanvas()">🗑️ Clear</button>
                
                <button class="btn-action" onclick="document.getElementById('fileInput').click()">📂 Încarcă Poză</button>
                <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
                
                <button onclick="processMath(false)">Rezolvă</button>
                <button onclick="processMath(true)">Pas cu Pas</button>
            </div>

            <div id="output">Scrie sau încarcă o ecuație!</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const bgCanvas = document.getElementById('canvas-bg');
        const bgCtx = bgCanvas.getContext('2d');
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const overlayCanvas = document.getElementById('whiteboard-overlay');
        const overlayCtx = overlayCanvas.getContext('2d');
        const output = document.getElementById('output');
        const camStatus = document.getElementById('camStatus');

        let last_x = null, last_y = null;
        let pointer_smooth_x = null, pointer_smooth_y = null;
        const alpha = 0.5;
        
        let penColor = 'black';
        let penWidth = 10;
        let eraserWidth = 40;
        let isEraser = false; 

        // DESENEAZĂ GRILA
        function drawGrid() {
            bgCtx.fillStyle = "white";
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            bgCtx.strokeStyle = "#d3d3d3"; 
            bgCtx.lineWidth = 2;
            bgCtx.setLineDash([5, 5]); 
            
            const cols = 5;
            const rows = 4;
            const cellWidth = bgCanvas.width / cols;
            const cellHeight = bgCanvas.height / rows;
            
            bgCtx.beginPath();
            for(let i = 1; i < cols; i++) {
                bgCtx.moveTo(i * cellWidth, 0);
                bgCtx.lineTo(i * cellWidth, bgCanvas.height);
            }
            for(let j = 1; j < rows; j++) {
                bgCtx.moveTo(0, j * cellHeight);
                bgCtx.lineTo(bgCanvas.width, j * cellHeight);
            }
            bgCtx.stroke();
            bgCtx.setLineDash([]);
        }

        drawGrid();

        function setMode(mode) {
            if (mode === 'eraser') {
                isEraser = true;
                camStatus.innerText = "Status: 🧽 Gumă activată";
                camStatus.style.color = "#ffff00";
            } else {
                isEraser = false;
                camStatus.innerText = `Status: ✒️ Creion (${penColor})`;
                camStatus.style.color = "#00ff00";
            }
        }

        // ==========================================
        // FUNCȚIA NOUĂ: ÎNCARCĂ IMAGINEA
        // ==========================================
       function loadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const newWidth = img.width * scale;
                    const newHeight = img.height * scale;
                    const x = (canvas.width - newWidth) / 2;
                    const y = (canvas.height - newHeight) / 2;

                    // MAGIC FIX: Modul 'multiply' face fundalul alb al pozei invizibil!
                    ctx.globalCompositeOperation = "multiply";
                    ctx.drawImage(img, x, y, newWidth, newHeight);
                    
                    // Resetăm la normal pentru creion/gumă
                    ctx.globalCompositeOperation = "source-over"; 
                    
                    output.innerText = "Imagine încărcată cu succes. Apasă 'Rezolvă'.";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
            event.target.value = '';
        }
        // MEDIAPIPE LOGIC (Neschimbat)
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const index_tip = landmarks[8];
                const middle_tip = landmarks[12];
                
                const w = canvas.width; const h = canvas.height;
                const raw_ix = Math.round((1 - index_tip.x) * w);
                const raw_iy = Math.round(index_tip.y * h);
                const mx = Math.round((1 - middle_tip.x) * w);
                const my = Math.round(middle_tip.y * h);
                
                if (pointer_smooth_x === null) {
                    pointer_smooth_x = raw_ix; pointer_smooth_y = raw_iy;
                } else {
                    pointer_smooth_x = alpha * raw_ix + (1 - alpha) * pointer_smooth_x;
                    pointer_smooth_y = alpha * raw_iy + (1 - alpha) * pointer_smooth_y;
                }

                const dist = Math.sqrt(Math.pow(raw_ix - mx, 2) + Math.pow(raw_iy - my, 2));
                const is_writing = dist < 40;
                
                let act = isEraser ? "Șterge" : "Scrie";
                if (is_writing) {
                    camStatus.innerText = `Status: ${act} | Poz: (${Math.round(pointer_smooth_x)}, ${Math.round(pointer_smooth_y)})`;
                    camStatus.style.color = isEraser ? '#ffff00' : '#ff00ff';
                }
                
                draw_writing(pointer_smooth_x, pointer_smooth_y, is_writing);
                draw_laser(pointer_smooth_x, pointer_smooth_y);
            } else {
                draw_writing(0, 0, false);
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start();

        function draw_writing(x, y, is_writing) {
            if (!is_writing) { last_x = null; last_y = null; return; }

            if (isEraser) {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = eraserWidth;
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penWidth;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (last_x !== null) {
                ctx.beginPath();
                ctx.moveTo(last_x, last_y);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(Math.round(x), Math.round(y), ctx.lineWidth / 2, 0, Math.PI * 2);
                if(isEraser) { ctx.fill(); } else { ctx.fillStyle = penColor; ctx.fill(); }
            }
            last_x = x; last_y = y;
            ctx.globalCompositeOperation = "source-over";
        }

        function draw_laser(x, y) {
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            if (isEraser) {
                overlayCtx.beginPath();
                overlayCtx.arc(Math.round(x), Math.round(y), eraserWidth / 2, 0, Math.PI * 2);
                overlayCtx.strokeStyle = "rgba(0, 0, 0, 0.5)";
                overlayCtx.lineWidth = 2;
                overlayCtx.stroke();
            } else {
                overlayCtx.beginPath();
                overlayCtx.arc(Math.round(x), Math.round(y), 6, 0, Math.PI * 2);
                overlayCtx.fillStyle = "red";
                overlayCtx.fill();
                overlayCtx.beginPath();
                overlayCtx.arc(Math.round(x), Math.round(y), 2, 0, Math.PI * 2);
                overlayCtx.fillStyle = "white";
                overlayCtx.fill();
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            output.innerText = "Tabla e curată!";
        }

        // Voce
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            document.getElementById('voiceBtn').addEventListener('click', () => {
                recognition.start();
                camStatus.innerText = "Ascult culori sau 'gumă'...";
            });
            recognition.onresult = (event) => {
                const command = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                if (command.includes("gumă") || command.includes("guma") || command.includes("eraser")) {
                    setMode('eraser'); return;
                }
                const validColors = {
                    "white": "white", "black": "black", "negru": "black", "red": "red", "roșu": "red",
                    "green": "green", "verde": "green", "blue": "blue", "albastru": "blue", 
                    "yellow": "yellow", "galben": "yellow", "pink": "#ffc0cb", "roz": "#ffc0cb"
                };
                let foundColor = Object.keys(validColors).find(c => command.includes(c));
                if(foundColor) {
                    penColor = validColors[foundColor];
                    setMode('pen'); 
                }
            };
        } else {
            document.getElementById('voiceBtn').style.display = 'none';
        }

        async function processMath(stepByStep) {
            output.innerText = "Analizez căsuțele...";
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.fillStyle = "white";
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0); 

            const imageData = tempCanvas.toDataURL('image/png');

            try {
                const response = await fetch('/process_math', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_data: imageData, step_by_step: stepByStep })
                });
                
                const data = await response.json();
                if (data.success) {
                    let text = `AI a recunoscut: ${data.equation}\nRăspuns matematic: ${data.answer}\n`;
                    if (stepByStep) text += `\n[Pași rezolvare]:\n${data.steps}`;
                    output.innerText = text;
                } else {
                    output.innerText = `Eroare procesare: ${data.message}`;
                }
            } catch (error) {
                output.innerText = `Eroare conexiune: ${error.message}`;
            }
        }
    </script>
</body>
</html>
