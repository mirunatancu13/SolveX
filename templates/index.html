<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolveX Air</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        * { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-sizing: border-box; }
        :root { --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #ffffff; --accent: #bb86fc; --success: #dea430; }
        
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
        
        #loadingScreen { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('/static/bg.jpg') center/cover; 
            z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s; 
        }
        .logo-container { font-size: 5rem; font-weight: bold; color: white; position: relative; display: flex; align-items: baseline; }
        .x-text { 
            color: var(--accent); position: absolute; left: -80px; 
            animation: ninjaJump 2.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; 
        }

        @keyframes ninjaJump { 
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; } 
            10% { transform: translate(27px, 0) scale(1) rotate(0deg); opacity: 1; } 
            25% { transform: translate(45px, -120px) rotate(90deg); } 
            40% { transform: translate(124px, -45px) rotate(180deg); } 
            55% { transform: translate(145px, -120px) rotate(270deg); } 
            70% { transform: translate(195px, -50px) rotate(360deg); } 
            85% { transform: translate(235px, -80px) rotate(450deg); } 
            100% { transform: translate(280px, 12px) rotate(540deg); opacity: 1; } 
        }

        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(18, 18, 18, 0.95); z-index: 9998; display: none; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .welcome-card { background: var(--panel-bg); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        .logo-x { color: var(--accent); font-weight: bold; }

        #startBtn { background: var(--success); color: black; border: none; padding: 15px 40px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.2rem; margin-top: 20px; }
        
        .header, .container { opacity: 0; transition: opacity 0.8s; pointer-events: none; }
        .header { text-align: center; padding: 10px; }
        .container { position: relative; width: 100%; height: 100%; }

        .panel { 
            position: absolute; 
            background: var(--panel-bg); 
            border-radius: 15px; 
            padding: 10px; display: 
            flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #444; min-width: 300px; min-height: 250px; z-index: 100; 
            resize: both; 
            overflow: hidden;
        }
        .panel-header { cursor: grab; padding: 10px; text-align: center; color: #888; background: #1a1a1a; margin: -10px -10px 10px -10px; font-size: 12px; user-select: none; }
        
        .whiteboard-container, video { flex: 1; width: 100%; height: 100%; background: #000; position: relative; border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #aiPanel { position: fixed; top: 20px; right: -400px; width: 350px; height: calc(100vh - 120px); background: rgba(30, 30, 30, 0.95); border-left: 3px solid var(--accent); z-index: 2000; padding: 20px; transition: right 0.5s; border-radius: 20px 0 0 20px; backdrop-filter: blur(10px); display: flex; flex-direction: column; }
        #aiPanel.open { right: 0; }
        .ai-section { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 15px; border-left: 3px solid var(--success); line-height: 1.45; overflow-wrap: anywhere; }

        .bottom-controls { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); 
            background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(20px); 
            padding: 12px 25px; display: none; gap: 10px; align-items: center; 
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); 
            z-index: 1001; opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bottom-controls button { border: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; color: white; background: #333; transition: 0.2s; }
        .bottom-controls button:hover { transform: translateY(-5px); filter: brightness(1.2); }
        .btn-separator { width: 1px; height: 25px; background: rgba(255,255,255,0.2); margin: 0 5px; }
        .btn-solve { background: var(--success) !important; color: black !important; }
        .btn-steps { background: var(--accent) !important; color: black !important; }
        .btn-clear { background: #cf6679 !important; }
    </style>
</head>
<body>

    <div id="loadingScreen"><div class="logo-container"><span>Solve</span><span class="x-text">X</span></div></div>
    
    <div id="welcomeScreen">
        <div class="welcome-card">
            <h2>Solve<span class="logo-x">X</span></h2>
            <p>Ready? Draw in the air or upload an image of your equation.</p>
            <button id="startBtn">Begin</button>
        </div>
    </div>
  
    <div id="aiPanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Solve<span class="logo-x">X</span> Assistant</h2>
            <button onclick="toggleAiPanel(false)" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">×</button>
        </div>
        <div id="aiResponseContent" style="flex:1; overflow-y:auto; margin-top:15px;"></div>
    </div>

    <div class="header"><h1>Solve<span class="logo-x">X</span> Air</h1></div>

    <div class="container">
        <div id="camPanel" class="panel" style="top: 10vh; left: 3vw; width: 350px; height: 280px;">
            <div class="panel-header">⋮⋮ Camera</div>
            <video id="videoElement" autoplay playsinline style="transform: scaleX(-1);"></video>
        </div>

        <div id="boardPanel" class="panel" style="top: 10vh; right: 3vw; width: 65vw; height: 75vh;">
            <div class="panel-header">⋮⋮ Whiteboard</div>
            <div class="whiteboard-container" id="boardContainer">
                <canvas id="canvas-bg"></canvas>
                <canvas id="canvas-img"></canvas>
                <canvas id="whiteboard"></canvas>
                <canvas id="whiteboard-overlay"></canvas>
            </div>
        </div>
    </div>

    <div class="bottom-controls">
        <button onclick="undoLast()">↩ Undo</button>
        <button onclick="redoLast()">↪ Redo</button>
        <div class="btn-separator"></div>
        <button onclick="setMode('pen')">✍🏼 Pen</button>
        <button onclick="setMode('eraser')">🧽 Eraser</button>
        <button class="btn-clear" onclick="clearCanvas()">🗑️</button>
        <div class="btn-separator"></div>
        <button style="background:#444;" onclick="document.getElementById('fileInput').click()">📂 Upload</button>
        <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)" style="display: none;">
        <div class="btn-separator"></div>
        <button class="btn-solve" onclick="processMath(false)">Solve</button>
        <button class="btn-steps" onclick="processMath(true)">Explain</button>
    </div>

    <script>
        
        // --- UI & LOADING ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('welcomeScreen').style.display = 'flex';
                }, 800);
            }, 2300);
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
                
                const header = document.querySelector('.header');
                const container = document.querySelector('.container');
                header.style.opacity = '1';
                header.style.pointerEvents = 'auto';
                container.style.opacity = '1';
                container.style.pointerEvents = 'auto';

                const ctrl = document.querySelector('.bottom-controls');
                ctrl.style.display = 'flex';
                setTimeout(() => {
                    ctrl.style.opacity = '1';
                    ctrl.style.transform = 'translateX(-50%) translateY(0)';
                }, 50);

                initCanvasSize();
                camera.start();
            }, 500);
        });

        // --- DRAGGABLE ---
        function makeDraggable(el) {
            const header = el.querySelector('.panel-header');
            header.onmousedown = function(e) {
                let pos3 = e.clientX, pos4 = e.clientY;
                document.querySelectorAll('.panel').forEach(p => p.style.zIndex = 100);
                el.style.zIndex = 1000;
                document.onmousemove = function(e) {
                    el.style.top = (el.offsetTop - (pos4 - e.clientY)) + "px";
                    el.style.left = (el.offsetLeft - (pos3 - e.clientX)) + "px";
                    pos3 = e.clientX; pos4 = e.clientY;
                };
                document.onmouseup = () => document.onmousemove = null;
            };
        }

        // --- CANVAS LOGIC ---
        // FIX #1: Definim TOATE variabilele canvas corect
        const board        = document.getElementById('whiteboard');
        const bgCanvas     = document.getElementById('canvas-bg');
        const imgCanvas    = document.getElementById('canvas-img');
        const overlayCanvas = document.getElementById('whiteboard-overlay'); // ERA LIPSA!

        const ctx        = board.getContext('2d');
        const bgCtx      = bgCanvas.getContext('2d');
        const imgCtx     = imgCanvas.getContext('2d');
        const overlayCtx = overlayCanvas.getContext('2d');
        
        let strokes = [], redoStack = [], currentStroke = null;
        let last_x = null, last_y = null, isEraser = false;
        let pointer_smooth_x = null, pointer_smooth_y = null;
        const alpha = 0.5;
        let penColor = "#ffffff";
        let currentUploadedImage = null; // Pentru a ține minte imaginea încărcată
        let mathVersion = 0;
        let solutionCache = null;

        function markMathChanged() {
            mathVersion += 1;
            solutionCache = null;
        }

        function initCanvasSize() {
            const container = document.getElementById('boardContainer');
            const rect = container.getBoundingClientRect();
            
            // Optimizare: Dacă lățimea nu s-a schimbat, nu dăm reset degeaba
            if (board.width === rect.width && board.height === rect.height) return;

            [board, bgCanvas, imgCanvas, overlayCanvas].forEach(c => {
                c.width = rect.width;
                c.height = rect.height;
            });
            bgCtx.fillStyle = "#121212";
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            redrawAll();
            drawUploadedImage(); // Redesenează imaginea dacă există
        }

        function setMode(m) { isEraser = (m === 'eraser'); }

        function draw(x, y, writing) {
            if (!writing) {
                if (currentStroke && currentStroke.points.length > 0) {
                    strokes.push(currentStroke);
                    redoStack = [];
                    markMathChanged();
                }
                currentStroke = null;
                last_x = null; last_y = null;
                return;
            }
            if (!currentStroke) currentStroke = { points: [], isEraser: isEraser, width: isEraser ? 40 : 8 };
            currentStroke.points.push({x, y});

            ctx.globalCompositeOperation = isEraser ? "destination-out" : "source-over";
            ctx.lineWidth = isEraser ? 40 : 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#ffffff';

            if (last_x !== null) {
                ctx.beginPath();
                ctx.moveTo(last_x, last_y);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                // Punct izolat (când dai click fără să miști)
                ctx.beginPath();
                ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fillStyle = isEraser ? 'rgba(0,0,0,1)' : '#ffffff';
                ctx.fill();
            }
            last_x = x; last_y = y;
            ctx.globalCompositeOperation = "source-over";
        }

        function drawUploadedImage() {
            if (!currentUploadedImage) return;
            imgCtx.clearRect(0, 0, board.width, board.height);
            const scale = Math.min(board.width / currentUploadedImage.width, board.height / currentUploadedImage.height);
            const nw = currentUploadedImage.width * scale, nh = currentUploadedImage.height * scale;
            const dx = (board.width - nw) / 2, dy = (board.height - nh) / 2;
            imgCtx.drawImage(currentUploadedImage, dx, dy, nw, nh);
        }

        function redrawAll() {
            ctx.clearRect(0, 0, board.width, board.height);
            strokes.forEach(s => {
                if (s.points.length === 0) return;
                ctx.globalCompositeOperation = s.isEraser ? "destination-out" : "source-over";
                ctx.lineWidth = s.width;
                ctx.strokeStyle = "#ffffff";
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(s.points[0].x, s.points[0].y);
                s.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            });
            ctx.globalCompositeOperation = "source-over";
        }

        function undoLast() { if(strokes.length) { redoStack.push(strokes.pop()); redrawAll(); markMathChanged(); } }
        function redoLast() { if(redoStack.length) { strokes.push(redoStack.pop()); redrawAll(); markMathChanged(); } }
        function clearCanvas() {
            strokes = []; redoStack = []; currentStroke = null;
            currentUploadedImage = null;
            ctx.clearRect(0, 0, board.width, board.height);
            imgCtx.clearRect(0, 0, board.width, board.height);
            markMathChanged();
        }

        function loadImage(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentUploadedImage = img; // Salvăm imaginea în memorie
                    drawUploadedImage();
                    markMathChanged();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function toggleAiPanel(o) { document.getElementById('aiPanel').classList.toggle('open', o); }

        function cropAndResizeCanvas(source) {
            const ctx = source.getContext('2d');
            const pixels = ctx.getImageData(0, 0, source.width, source.height);
            const data = pixels.data;
            let minX = source.width, minY = source.height, maxX = 0, maxY = 0;

            for (let y = 0; y < source.height; y += 2) {
                for (let x = 0; x < source.width; x += 2) {
                    const i = (y * source.width + x) * 4;
                    const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                    if (a > 0 && (r < 245 || g < 245 || b < 245)) {
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            if (minX > maxX || minY > maxY) {
                const blank = document.createElement('canvas');
                blank.width = 64;
                blank.height = 64;
                const blankCtx = blank.getContext('2d');
                blankCtx.fillStyle = "white";
                blankCtx.fillRect(0, 0, blank.width, blank.height);
                return blank;
            }

            const pad = 32;
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(source.width, maxX + pad);
            maxY = Math.min(source.height, maxY + pad);

            const cropW = maxX - minX;
            const cropH = maxY - minY;
            const maxSide = 900;
            const scale = Math.min(1, maxSide / Math.max(cropW, cropH));

            const out = document.createElement('canvas');
            out.width = Math.max(1, Math.round(cropW * scale));
            out.height = Math.max(1, Math.round(cropH * scale));
            const outCtx = out.getContext('2d');
            outCtx.fillStyle = "white";
            outCtx.fillRect(0, 0, out.width, out.height);
            outCtx.drawImage(source, minX, minY, cropW, cropH, 0, 0, out.width, out.height);
            return out;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderCachedMath(data, showSteps) {
            let htmlContent = `
                <div class="ai-section">
                    <b style="color:var(--accent)">Equation</b><br>
                    ${escapeHtml(data.equation)}
                </div>
                <div class="ai-section" style="border-left-color: #4caf50;">
                    <b style="color:var(--success)">Final result:</b><br>
                    <span style="font-size: 1.5rem; font-weight: bold;">${escapeHtml(data.answer)}</span>
                </div>
            `;

            if (data.elapsed_seconds) {
                htmlContent += `
                    <div style="color:#888; font-size:0.85rem; margin-bottom:12px;">
                        Took ${escapeHtml(data.elapsed_seconds)}s
                    </div>
                `;
            }

            if (showSteps && data.steps && data.steps !== "Direct calculus") {
                htmlContent += `
                    <div class="ai-section" style="border-left-color: #ffb74d;">
                        <b style="color:var(--accent)">Explanation: </b><br>
                        <div style="white-space: pre-line; margin-top:10px;">${escapeHtml(data.steps)}</div>
                    </div>
                `;
            }

            document.getElementById('aiResponseContent').innerHTML = htmlContent;
        }

        async function processMath(sbs) {
            toggleAiPanel(true);

            if (solutionCache && solutionCache.version === mathVersion) {
                renderCachedMath(solutionCache.data, sbs);
                return;
            }

            const requestVersion = mathVersion;

            document.getElementById('aiResponseContent').innerHTML = sbs
                ? "SolveX is explaining..."
                : "SolveX is solving...";

            const temp = document.createElement('canvas');
            temp.width = board.width;
            temp.height = board.height;
            const tCtx = temp.getContext('2d');

            // 1. Fundal alb pentru OCR
            tCtx.fillStyle = "white";
            tCtx.fillRect(0, 0, temp.width, temp.height);

            // 2. Desenăm imaginea încărcată (dacă există)
            const uploadedImg = document.getElementById('canvas-img');
            tCtx.drawImage(uploadedImg, 0, 0, temp.width, temp.height);

            // 3. Desenăm scrisul cu linii negre subțiri pentru OCR
            tCtx.lineCap = 'round';
            tCtx.lineJoin = 'round';
            tCtx.lineWidth = 3;
            tCtx.strokeStyle = "black";

            strokes.forEach(s => {
                if (s.points.length > 0 && !s.isEraser) {
                    tCtx.beginPath();
                    tCtx.moveTo(s.points[0].x, s.points[0].y);
                    s.points.forEach(p => tCtx.lineTo(p.x, p.y));
                    tCtx.stroke();
                }
            });

            try {
                const res = await fetch('/process_math', { 
                    method: 'POST', 
                    headers: {'Content-Type':'application/json'}, 
                    body: JSON.stringify({ image_data: cropAndResizeCanvas(temp).toDataURL('image/png'), step_by_step: true }) 
                });
                
                const data = await res.json();
                
                if(data.success) {
                    solutionCache = { version: requestVersion, data };
                    if (requestVersion !== mathVersion) {
                        document.getElementById('aiResponseContent').innerHTML = "The board changed. Press Solve again.";
                        return;
                    }
                    renderCachedMath(data, sbs);
                    return;
                    // Construim interfața de bază (Ecuație + Rezultat)
                    let htmlContent = `
                        <div class="ai-section">
                            <b style="color:var(--accent)">Ecuation</b><br>
                            ${escapeHtml(data.equation)}
                        </div>
                        <div class="ai-section" style="border-left-color: #4caf50;">
                            <b style="color:var(--success)">Final result:</b><br>
                            <span style="font-size: 1.5rem; font-weight: bold;">${escapeHtml(data.answer)}</span>
                        </div>
                    `;

                    // Dacă s-a apăsat EXPLAIN (sbs = true) ȘI avem pași de la AI, îi adăugăm
                    if (data.elapsed_seconds) {
                        htmlContent += `
                            <div style="color:#888; font-size:0.85rem; margin-bottom:12px;">
                                Took ${escapeHtml(data.elapsed_seconds)}s
                            </div>
                        `;
                    }

                    if (sbs && data.steps && data.steps !== "Direct calculus") {
                        htmlContent += `
                            <div class="ai-section" style="border-left-color: #ffb74d;">
                                <b style="color:var(--accent)">Explanation: </b><br>
                                <div style="white-space: pre-line; margin-top:10px;">${escapeHtml(data.steps)}</div>
                            </div>
                        `;
                    }

                    // Afișăm pe ecran
                    document.getElementById('aiResponseContent').innerHTML = htmlContent;
                } else {
                    document.getElementById('aiResponseContent').innerHTML = `
                        <div class="ai-section" style="border-left-color: #cf6679;">
                            Error: ${escapeHtml(data.error || data.message || "Unknown error")}
                        </div>
                    `;
                }
            } catch(e) {
                document.getElementById('aiResponseContent').innerHTML = `Connection error: ${escapeHtml(e.message)}`;
            }
        }
        // --- MEDIAPIPE HANDS ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.5
        });
        
        hands.onResults((results) => {
            // FIX #1 aplicat: overlayCanvas e acum definit, nu mai aruncă ReferenceError
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const index_tip = landmarks[8];
                const middle_tip = landmarks[12];
                
                const w = board.width; 
                const h = board.height;
                const raw_ix = Math.round((1 - index_tip.x) * w);
                const raw_iy = Math.round(index_tip.y * h);
                const mx = Math.round((1 - middle_tip.x) * w);
                const my = Math.round(middle_tip.y * h);
                
                if (pointer_smooth_x === null) {
                    pointer_smooth_x = raw_ix; pointer_smooth_y = raw_iy;
                } else {
                    pointer_smooth_x = alpha * raw_ix + (1 - alpha) * pointer_smooth_x;
                    pointer_smooth_y = alpha * raw_iy + (1 - alpha) * pointer_smooth_y;
                }

                // Distanța index-middle: mic = scriem, mare = nu scriem
                const dist = Math.sqrt(Math.pow(raw_ix - mx, 2) + Math.pow(raw_iy - my, 2));
                const is_writing = dist < 40;
                
                draw(pointer_smooth_x, pointer_smooth_y, is_writing);
                
                // Cursor vizual
                if (isEraser) {
                    overlayCtx.beginPath();
                    overlayCtx.arc(Math.round(pointer_smooth_x), Math.round(pointer_smooth_y), 20, 0, Math.PI * 2);
                    overlayCtx.strokeStyle = "rgba(187, 134, 252, 0.8)";
                    overlayCtx.lineWidth = 2;
                    overlayCtx.stroke();
                } else {
                    overlayCtx.beginPath();
                    overlayCtx.arc(Math.round(pointer_smooth_x), Math.round(pointer_smooth_y), 6, 0, Math.PI * 2);
                    overlayCtx.fillStyle = penColor; 
                    overlayCtx.fill();
                    overlayCtx.beginPath();
                    overlayCtx.arc(Math.round(pointer_smooth_x), Math.round(pointer_smooth_y), 2, 0, Math.PI * 2);
                    overlayCtx.fillStyle = "white";
                    overlayCtx.fill();
                }
            } else {
                draw(0, 0, false);
            }
        });

        const videoEl = document.getElementById('videoElement');
        const camera = new Camera(videoEl, {
            onFrame: async () => { await hands.send({image: videoEl}); },
            width: 640, height: 480
        });

        makeDraggable(document.getElementById('camPanel'));
        makeDraggable(document.getElementById('boardPanel'));

        const resizeObserver = new ResizeObserver(() => {
            if (document.getElementById('welcomeScreen').style.display === 'none') {
                initCanvasSize();
            }
        });
        resizeObserver.observe(document.getElementById('boardPanel'));
        resizeObserver.observe(document.getElementById('camPanel'));
        
    </script>
</body>
</html>
